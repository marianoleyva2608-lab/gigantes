<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gigantes · Control de Cubeteros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d3963;--navy2:#082848;--sky:#6cb3df;--sky2:#e3f1fa;--red:#c8102e;--ink:#10223a;--mut:#5b6b80;--line:#d7e2ec;--bg:#f3f7fb;--ok:#1b8a4b;--warn:#c27c00}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",sans-serif;letter-spacing:.3px}
header{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--red)}
header img{width:46px;height:auto}
header h1{margin:0;font-size:24px;line-height:1}
header small{display:block;color:var(--sky);font-family:Barlow;font-size:13px;letter-spacing:0}
.hspace{flex:1}
.evsel{display:flex;align-items:center;gap:8px}
.evsel select{background:#fff1;color:#fff;border:1px solid #fff5;border-radius:8px;padding:7px 9px;font:inherit}
.evsel select option{color:#000}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:#fff2;white-space:nowrap}
.pill.off{background:var(--warn)}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:13px 14px;font:600 15px Barlow;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid var(--sky);border-color:var(--sky)}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.btn{font:700 15px Barlow;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;background:var(--navy);color:#fff}
.btn.red{background:var(--red)}.btn.sky{background:var(--sky);color:var(--navy2)}.btn.ok{background:var(--ok)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{font-size:22px;padding:14px 18px}
.kpi{background:var(--sky2);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 26px "Barlow Condensed";color:var(--navy)}
.kpi span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi.alert{background:#fde8eb}.kpi.alert b{color:var(--red)}
.kpi.good{background:#e3f5ea}.kpi.good b{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--line);padding:8px 6px;letter-spacing:.3px}
td{border-bottom:1px solid var(--line);padding:9px 6px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--sky2)}
.tw{overflow-x:auto}
.cub-head{display:flex;align-items:center;gap:14px}
.num{background:var(--navy);color:#fff;font:800 30px "Barlow Condensed";border-radius:10px;min-width:64px;text-align:center;padding:4px 10px}
.muted{color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;font:700 20px Barlow;cursor:pointer;color:var(--navy)}
.step input{width:70px;text-align:center;font-weight:700;font-size:18px}
.prodline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sky2);color:var(--navy);font-weight:600}
.tag.red{background:#fde8eb;color:var(--red)}.tag.ok{background:#e3f5ea;color:var(--ok)}.tag.gray{background:#eee;color:#777}
.strike{text-decoration:line-through;opacity:.5}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:20;overflow:auto}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px}
#modal h2{margin:0 0 10px;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90vw}
.totalbar{background:var(--navy);color:#fff;border-radius:10px;padding:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.totalbar b{font:800 28px "Barlow Condensed"}
.banner{background:#fff4dc;border:1px solid #f1d38f;color:#7a5200;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
@media(max-width:600px){header h1{font-size:20px}.hide-m{display:none}}
</style>
</head>

<script>
// ---------- Datos ----------
const COLS=['productos','cubeteros','eventos','movs'];
const S={productos:[],cubeteros:[],eventos:[],movs:[]};
let DB=null, MODE='cargando', STALE=false, READONLY=false;
const LSKEY='gig_cubeteros_v1', PREF='gig_cub_pref';
const pref=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||'{}')}catch(e){return{}}})();
function savePref(){try{localStorage.setItem(PREF,JSON.stringify(pref))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round((n||0)*100)/100).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const fdt=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}

// Catálogo base de productos de estadio (se carga si no hay productos)
const PROD_BASE=[
 {id:'p01cervclara',nombre:'Cerveza clara lata 355 ml',precio:70,comision:8,orden:1},
 {id:'p02cervoscura',nombre:'Cerveza oscura lata 355 ml',precio:70,comision:8,orden:2},
 {id:'p03cervgrande',nombre:'Cerveza lata 473 ml',precio:85,comision:10,orden:3},
 {id:'p04michelada',nombre:'Michelada',precio:110,comision:12,orden:4},
 {id:'p05refresco',nombre:'Refresco lata 355 ml',precio:40,comision:5,orden:5},
 {id:'p06agua',nombre:'Agua natural 600 ml',precio:30,comision:4,orden:6},
 {id:'p07mineral',nombre:'Agua mineral 355 ml',precio:35,comision:4,orden:7},
 {id:'p08hidratante',nombre:'Bebida hidratante 600 ml',precio:45,comision:5,orden:8},
 {id:'p09papas',nombre:'Papas fritas bolsa',precio:35,comision:4,orden:9},
 {id:'p10chascas',nombre:'Chascas (vaso de elote)',precio:60,comision:6,orden:10},
 {id:'p11cacahuates',nombre:'Cacahuates japoneses',precio:30,comision:4,orden:11},
 {id:'p12palomitas',nombre:'Palomitas',precio:45,comision:5,orden:12},
 {id:'p13churros',nombre:'Churros',precio:40,comision:5,orden:13},
 {id:'p14pepitas',nombre:'Pepitas / semillas',precio:30,comision:4,orden:14},
 {id:'p15dulces',nombre:'Dulces / gomitas',precio:30,comision:4,orden:15},
];
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LSKEY)||'{}');COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}}

async function put(col,obj){
  obj={...obj}; if(!obj.id)obj.id=uid();
  if(DB){
    const {id,...rest}=obj;
    try{await DB.collection(col).doc(id).set(JSON.parse(JSON.stringify(rest)))}
    catch(e){ if(e&&e.code==='invalid_argument'){READONLY=true;toast('No tienes permiso para guardar cambios');render()}
      else if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));await DB.collection(col).doc(id).set(JSON.parse(JSON.stringify(rest)))}
      else{toast('Error al guardar: '+(e&&e.message||e));throw e} }
  }else{
    const a=S[col],i=a.findIndex(x=>x.id===obj.id); if(i>=0)a[i]=obj; else a.push(obj); saveLocal(); render();
  }
  return obj;
}
async function remove(col,id){
  if(DB){try{await DB.collection(col).doc(id).delete()}catch(e){toast('Error al borrar')}}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}
}

async function init(){
  let db=null;
  try{ if(window.claude&&claude.use) db=await claude.use('db'); }catch(e){db=null}
  if(db){
    DB=db; MODE='nube'; let pending=new Set(COLS);
    const timer=setTimeout(()=>{STALE=true;render()},10000);
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{
        S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
        if(!snap.metadata.fromCache){pending.delete(c); if(!pending.size){clearTimeout(timer);STALE=false}}
        render();
      },err=>{clearTimeout(timer);STALE=true;if(err&&err.code==='revoked')READONLY=true;render()});
    });
  }else{ MODE='local'; loadLocal(); if(!S.productos.length){S.productos=PROD_BASE.map(p=>({...p,activo:true}));saveLocal();} }
  render();
}

// ---------- Cálculos ----------
const prod=id=>S.productos.find(p=>p.id===id);
const cubOf=id=>S.cubeteros.find(c=>c.id===id);
const evActual=()=>S.eventos.find(e=>e.id===pref.ev)||S.eventos.filter(e=>e.estado!=='cerrado').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''))[0]||null;
const movsDe=(ev,cub)=>S.movs.filter(m=>m.ev===ev&&!m.anulado&&(!cub||m.cub===cub));

function resumen(ev,cub){
  const r={porProd:{},pzEnt:0,pzDev:0,pzVend:0,venta:0,com:0,debe:0,ef:0,tj:0,pagado:0,saldo:0,valorEnMano:0,cerrado:false,movs:0};
  const ms=movsDe(ev,cub); r.movs=ms.length;
  for(const m of ms){
    if(m.tipo==='entrega'||m.tipo==='devolucion'){
      for(const [k,q] of Object.entries(m.items||{})){
        const pp=r.porProd[k]||(r.porProd[k]={ent:0,dev:0});
        if(m.tipo==='entrega')pp.ent+=q; else pp.dev+=q;
      }
    }
    if(m.tipo==='pago'){ if(m.metodo==='tarjeta')r.tj+=m.monto||0; else r.ef+=m.monto||0; }
    if(m.final)r.cerrado=true;
  }
  for(const [k,pp] of Object.entries(r.porProd)){
    const p=prod(k)||{precio:0,comision:0};
    pp.vend=pp.ent-pp.dev; pp.venta=pp.vend*(+p.precio||0); pp.com=pp.vend*(+p.comision||0);
    r.pzEnt+=pp.ent;r.pzDev+=pp.dev;r.pzVend+=pp.vend;r.venta+=pp.venta;r.com+=pp.com;
  }
  r.pagado=r.ef+r.tj; r.debe=r.venta-r.com; r.saldo=r.debe-r.pagado;
  return r;
}

// ---------- UI ----------
const TABS=[['op','Operación'],['corte','Cubeteros en evento'],['rep','Reporte'],['cfg','Configuración']];
let TAB=pref.tab||'op', SEL=null;

function render(){
  const pill=$('#modePill');
  pill.textContent=MODE==='nube'?(STALE?'Sin conexión · reintentando':'En línea · compartido'):MODE==='local'?'Solo este dispositivo':'Cargando…';
  pill.className='pill'+((MODE==='local'||STALE)?' off':'');
  const ev=evActual();
  const sel=$('#evSel');
  const evs=[...S.eventos].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  sel.innerHTML=evs.length?evs.map(e=>`<option value="${e.id}" ${ev&&e.id===ev.id?'selected':''}>${esc(e.nombre)}${e.estado==='cerrado'?' (cerrado)':''}</option>`).join(''):'<option>Sin eventos</option>';
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${TAB===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
  const m=$('#main');
  let h='';
  if(MODE==='local')h+=`<div class="banner">Modo local: los datos se guardan solo en este navegador. Para compartir entre tablets abre la app desde su enlace de Claude con tu cuenta.</div>`;
  if(READONLY)h+=`<div class="banner">Tienes acceso de solo lectura. Pide al administrador permiso de <b>Colaborador</b> para registrar movimientos.</div>`;
  if(TAB==='cfg')h+=viewCfg();
  else if(!S.productos.length||!S.cubeteros.length||!ev)h+=viewOnboard(ev);
  else if(TAB==='op')h+=viewOp(ev);
  else if(TAB==='corte')h+=viewCorte(ev);
  else if(TAB==='rep')h+=viewRep(ev);
  const focusId=document.activeElement&&document.activeElement.id;
  m.innerHTML=h;
  if(focusId==='buscar'||(TAB==='op'&&!SEL)){const b=$('#buscar');if(b&&focusId==='buscar'){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
}

function viewOnboard(ev){
  const ok=(b)=>b?'<span class="tag ok">Listo</span>':'<span class="tag red">Pendiente</span>';
  return `<div class="card"><h2>Primeros pasos</h2>
  <p class="muted">Configura esto una vez y luego todo se maneja desde <b>Operación</b>.</p>
  <div class="prodline"><span>1. Da de alta los productos con precio y comisión por pieza</span>${ok(S.productos.length)}</div>
  <div class="prodline"><span>2. Registra a los cubeteros (número de gafete y nombre)</span>${ok(S.cubeteros.length)}</div>
  <div class="prodline"><span>3. Crea el evento o partido de hoy</span>${ok(ev)}</div>
  <p><button class="btn red" data-tab="cfg">Ir a Configuración</button></p></div>`;
}

// ----- Operación -----
let QUERY='';
function viewOp(ev){
  const cerrado=ev.estado==='cerrado';
  let h=`<div class="card"><div class="row">
    <input id="buscar" class="big" style="flex:1;min-width:200px" placeholder="No. de gafete o nombre del cubetero" value="${esc(QUERY)}" autocomplete="off" inputmode="search">
  </div>`;
  const q=QUERY.trim().toLowerCase();
  if(q&&!SEL){
    const res=S.cubeteros.filter(c=>c.activo!==false&&(String(c.numero)===q||String(c.numero).startsWith(q)||(c.nombre||'').toLowerCase().includes(q))).slice(0,8);
    h+=res.length?res.map(c=>`<div class="prodline click" data-pick="${c.id}" style="cursor:pointer"><span><b>#${esc(c.numero)}</b> ${esc(c.nombre)}</span><span class="tag">Seleccionar</span></div>`).join(''):'<p class="muted">Sin coincidencias.</p>';
  }
  h+=`<p class="muted" style="margin:8px 0 0">Escribe el número y presiona Enter. Un lector de código de barras/QR USB o Bluetooth funciona igual que el teclado.</p></div>`;
  if(SEL){
    const c=cubOf(SEL); if(!c){SEL=null;return h}
    const r=resumen(ev.id,c.id);
    // valor en mano: lo que traería si vendió todo lo no devuelto
    h+=`<div class="card"><div class="cub-head"><div class="num">${esc(c.numero)}</div><div style="flex:1"><h2 style="margin:0">${esc(c.nombre)}</h2><div class="muted">${esc(c.telefono||'')} ${c.deposito?'· Depósito '+money(c.deposito):''}</div></div>
      ${r.cerrado?'<span class="tag ok">Corte cerrado</span>':''}<button class="btn ghost sm" data-act="cerrarSel">✕</button></div>
      <div class="grid" style="margin-top:14px">
        <div class="kpi"><span>Piezas entregadas</span><b>${r.pzEnt}</b></div>
        <div class="kpi"><span>Devueltas</span><b>${r.pzDev}</b></div>
        <div class="kpi"><span>Valor por cobrar*</span><b>${money(r.debe)}</b></div>
        <div class="kpi good"><span>Pagado</span><b>${money(r.pagado)}</b></div>
        <div class="kpi ${r.saldo>0.009?'alert':'good'}"><span>Saldo pendiente</span><b>${money(r.saldo)}</b></div>
      </div>
      <p class="muted" style="margin:6px 0 0">*Lo entregado menos lo devuelto, ya descontada su comisión (${money(r.com)}).</p>
      <div class="row" style="margin-top:14px">
        <button class="btn big" data-act="entrega" ${cerrado||READONLY?'disabled':''}>＋ Entregar producto</button>
        <button class="btn big ok" data-act="pago" ${cerrado||READONLY?'disabled':''}>$ Recibir pago</button>
        <button class="btn big red" data-act="corte" ${cerrado||READONLY?'disabled':''}>Corte final</button>
      </div></div>`;
    h+=histHTML(movsAll(ev.id,c.id));
  }
  return h;
}
const movsAll=(ev,cub)=>S.movs.filter(m=>m.ev===ev&&m.cub===cub).sort((a,b)=>b.ts-a.ts);
function itemsTxt(items){return Object.entries(items||{}).filter(([,q])=>q).map(([k,q])=>`${q} ${esc((prod(k)||{nombre:'?'}).nombre)}`).join(', ')}
function histHTML(ms){
  if(!ms.length)return `<div class="card"><p class="muted" style="margin:0">Sin movimientos en este evento.</p></div>`;
  const lbl={entrega:['Entrega',''],devolucion:['Devolución','gray'],pago:['Pago','ok']};
  return `<div class="card"><h3 style="margin-top:0">Movimientos</h3><div class="tw"><table><tr><th>Hora</th><th>Tipo</th><th>Detalle</th><th class="hide-m">Registró</th><th></th></tr>`+
  ms.map(m=>`<tr class="${m.anulado?'strike':''}"><td>${fdt(m.ts)}</td><td><span class="tag ${lbl[m.tipo][1]}">${lbl[m.tipo][0]}${m.final?' final':''}</span></td>
   <td>${m.tipo==='pago'?money(m.monto)+' '+(m.metodo==='tarjeta'?'tarjeta':'efectivo'):itemsTxt(m.items)}${m.nota?' · '+esc(m.nota):''}</td>
   <td class="hide-m muted">${esc(m.por||'')}</td>
   <td>${m.anulado?'<span class="muted">anulado</span>':(READONLY?'':`<button class="btn ghost sm" data-anular="${m.id}">Anular</button>`)}</td></tr>`).join('')+`</table></div></div>`;
}

// ----- Modales de captura -----
function openModal(html){const mb=$("#mbox");mb.oninput=null;mb._upd=null;mb.dataset.bad="";mb.innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
function stepper(p,val=0,extra=''){return `<div class="prodline"><div><b>${esc(p.nombre)}</b> <span class="muted">${money(p.precio)}</span>${extra}</div>
 <div class="step"><button type="button" data-st="${p.id}" data-d="-1">−</button><input type="number" min="0" inputmode="numeric" id="q_${p.id}" value="${val}"><button type="button" data-st="${p.id}" data-d="1">+</button>
 <button type="button" class="btn ghost sm" data-st="${p.id}" data-d="12">+12</button><button type="button" class="btn ghost sm" data-st="${p.id}" data-d="24">+24</button></div></div>`}
const activos=()=>S.productos.filter(p=>p.activo!==false).sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre));
function readItems(list){const o={};let t=0;for(const p of list){const v=Math.max(0,parseInt(($('#q_'+p.id)||{}).value)||0);if(v){o[p.id]=v;t+=v}}return [o,t]}

function modalEntrega(){
  const c=cubOf(SEL);
  openModal(`<h2>Entregar a #${esc(c.numero)} ${esc(c.nombre)}</h2>${activos().map(p=>stepper(p)).join('')}
   <div class="totalbar"><span>Valor de la entrega</span><b id="tot">$0</b></div>
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn" data-act="guardarEntrega">Registrar entrega</button></div>`);
  liveTotal(()=>{const [o]=readItems(activos());return Object.entries(o).reduce((s,[k,q])=>s+q*prod(k).precio,0)});
}
function modalPago(){
  const ev=evActual(),c=cubOf(SEL),r=resumen(ev.id,c.id);
  openModal(`<h2>Pago de #${esc(c.numero)} ${esc(c.nombre)}</h2>
   <p class="muted">Corte parcial: recibe el dinero de lo que ya vendió. Saldo si vendió todo lo entregado: <b>${money(r.saldo)}</b></p>
   <div class="grid"><label>Efectivo<input type="number" min="0" step="any" id="pEf" inputmode="decimal" placeholder="0"></label>
   <label>Tarjeta / terminal<input type="number" min="0" step="any" id="pTj" inputmode="decimal" placeholder="0"></label></div>
   <label style="margin-top:10px">Nota (opcional)<input id="pNota"></label>
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn ok" data-act="guardarPago">Registrar pago</button></div>`);
  setTimeout(()=>$('#pEf')&&$('#pEf').focus(),50);
}
function modalCorte(){
  const ev=evActual(),c=cubOf(SEL),r0=resumen(ev.id,c.id);
  const list=activos().filter(p=>r0.porProd[p.id]);
  if(!list.length){toast('Este cubetero no tiene entregas');return}
  openModal(`<h2>Corte final · #${esc(c.numero)} ${esc(c.nombre)}</h2>
   <p class="muted">Cuenta lo que regresa sin vender. El sistema calcula lo vendido y lo que debe pagar.</p>
   ${list.map(p=>{const pp=r0.porProd[p.id];return stepper(p,0,` <span class="tag">Trae ${pp.ent-pp.dev}</span>`)}).join('')}
   <div id="calc" style="margin-top:10px"></div>
   <div class="grid" style="margin-top:10px"><label>Paga en efectivo<input type="number" min="0" step="any" id="cEf" inputmode="decimal"></label>
   <label>Paga con tarjeta<input type="number" min="0" step="any" id="cTj" inputmode="decimal" value="0"></label></div>
   <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn red" data-act="guardarCorte">Cerrar corte</button></div>`);
  const upd=()=>{
    const [dev]=readItems(list); let vend=0,venta=0,com=0,bad=false;
    for(const p of list){const pp=r0.porProd[p.id];const v=pp.ent-pp.dev-(dev[p.id]||0);if(v<0)bad=true;vend+=v;venta+=v*p.precio;com+=v*(p.comision||0)}
    const saldo=venta-com-r0.pagado;
    $('#calc').innerHTML=`<div class="grid"><div class="kpi"><span>Vendidas</span><b>${vend}</b></div><div class="kpi"><span>Venta</span><b>${money(venta)}</b></div><div class="kpi"><span>Su comisión</span><b>${money(com)}</b></div><div class="kpi"><span>Ya pagó</span><b>${money(r0.pagado)}</b></div></div>
     ${bad?'<p class="tag red" style="display:inline-block;margin-top:8px">Devuelve más de lo que trae</p>':''}
     <div class="totalbar"><span>Debe pagar ahora</span><b>${money(saldo)}</b></div>`;
    const ef=$('#cEf'); if(!ef.dataset.touched){ef.value=Math.max(0,Math.round(saldo*100)/100)}
    $('#mbox').dataset.bad=bad?'1':'';
  };
  $('#cEf').addEventListener('input',e=>e.target.dataset.touched='1');
  $('#mbox').oninput=upd; $('#mbox')._upd=upd; upd();
}
function liveTotal(fn){const u=()=>$('#tot').textContent=money(fn());$('#mbox').oninput=u;$('#mbox')._upd=u;u()}

function baseMov(tipo){const ev=evActual();return{ev:ev.id,cub:SEL,tipo,ts:Date.now(),por:pref.punto||''}}
async function guardarEntrega(){
  const [items,t]=readItems(activos()); if(!t)return toast('Captura al menos una pieza');
  closeModal(); await put('movs',{...baseMov('entrega'),items}); toast('Entrega registrada: '+t+' pzs');
}
async function guardarPago(){
  const ef=+$('#pEf').value||0,tj=+$('#pTj').value||0,nota=$('#pNota').value.trim();
  if(ef<0||tj<0||(!ef&&!tj))return toast('Captura un monto');
  closeModal();
  if(ef)await put('movs',{...baseMov('pago'),monto:ef,metodo:'efectivo',nota});
  if(tj)await put('movs',{...baseMov('pago'),monto:tj,metodo:'tarjeta',nota});
  toast('Pago registrado: '+money(ef+tj));
}
async function guardarCorte(){
  if($('#mbox').dataset.bad)return toast('Revisa las devoluciones');
  const ev=evActual(),r0=resumen(ev.id,SEL);
  const list=activos().filter(p=>r0.porProd[p.id]);
  const [items]=readItems(list);
  const ef=+$('#cEf').value||0,tj=+$('#cTj').value||0;
  closeModal();
  await put('movs',{...baseMov('devolucion'),items,final:true});
  if(ef)await put('movs',{...baseMov('pago'),monto:ef,metodo:'efectivo',final:true});
  if(tj)await put('movs',{...baseMov('pago'),monto:tj,metodo:'tarjeta',final:true});
  const r=resumen(ev.id,SEL);
  toast(Math.abs(r.saldo)<0.01?'Corte cerrado, cuenta saldada':'Corte cerrado con diferencia de '+money(r.saldo));
}

// ----- Cubeteros en evento -----
function viewCorte(ev){
  const rows=S.cubeteros.map(c=>({c,r:resumen(ev.id,c.id)})).filter(x=>x.r.movs>0).sort((a,b)=>b.r.saldo-a.r.saldo);
  if(!rows.length)return `<div class="card empty">Aún no hay cubeteros con movimientos en <b>${esc(ev.nombre)}</b>.</div>`;
  return `<div class="card"><h2 style="margin-top:0">${esc(ev.nombre)} · ${rows.length} cubeteros</h2><div class="tw"><table>
  <tr><th>#</th><th>Nombre</th><th class="n">Entregó</th><th class="n">Devolvió</th><th class="n">Vendió</th><th class="n">Por cobrar</th><th class="n">Pagado</th><th class="n">Saldo</th><th>Estado</th></tr>
  ${rows.map(({c,r})=>`<tr class="click" data-goto="${c.id}"><td><b>${esc(c.numero)}</b></td><td>${esc(c.nombre)}</td><td class="n">${r.pzEnt}</td><td class="n">${r.pzDev}</td><td class="n">${r.cerrado?r.pzVend:'—'}</td><td class="n">${money(r.debe)}</td><td class="n">${money(r.pagado)}</td>
  <td class="n" style="color:${r.saldo>0.009?'var(--red)':'var(--ok)'};font-weight:700">${money(r.saldo)}</td><td>${r.cerrado?(Math.abs(r.saldo)<0.01?'<span class="tag ok">Liquidado</span>':'<span class="tag red">Con diferencia</span>'):'<span class="tag">Vendiendo</span>'}</td></tr>`).join('')}
  </table></div><p class="muted">Toca un renglón para abrir al cubetero. "Vendió" aparece al cerrar su corte.</p></div>`;
}

// ----- Reporte -----
function viewRep(ev){
  const R=resumen(ev.id,null);
  const porCub=S.cubeteros.map(c=>({c,r:resumen(ev.id,c.id)})).filter(x=>x.r.movs).sort((a,b)=>b.r.venta-a.r.venta);
  const abiertos=porCub.filter(x=>!x.r.cerrado).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(ev.nombre)}</h2><div class="row">
   <button class="btn ghost sm" data-act="csv">Copiar CSV</button>
   ${ev.estado==='cerrado'?'<span class="tag gray">Evento cerrado</span>':(READONLY?'':`<button class="btn red sm" data-act="cerrarEv">Cerrar evento</button>`)}</div></div>
   ${abiertos?`<p class="muted">${abiertos} cubetero(s) sin corte final: sus cifras de venta son estimadas (todo lo no devuelto cuenta como vendido).</p>`:''}
   <div class="grid" style="margin-top:12px">
    <div class="kpi"><span>Venta</span><b>${money(R.venta)}</b></div>
    <div class="kpi"><span>Piezas vendidas</span><b>${R.pzVend}</b></div>
    <div class="kpi"><span>Comisiones</span><b>${money(R.com)}</b></div>
    <div class="kpi"><span>Neto a recibir</span><b>${money(R.debe)}</b></div>
    <div class="kpi good"><span>Efectivo</span><b>${money(R.ef)}</b></div>
    <div class="kpi good"><span>Tarjeta</span><b>${money(R.tj)}</b></div>
    <div class="kpi ${R.saldo>0.009?'alert':'good'}"><span>Pendiente</span><b>${money(R.saldo)}</b></div>
   </div></div>
   <div class="card"><h3 style="margin-top:0">Por producto</h3><div class="tw"><table><tr><th>Producto</th><th class="n">Entregado</th><th class="n">Devuelto</th><th class="n">Vendido</th><th class="n">Precio</th><th class="n">Venta</th></tr>
   ${Object.entries(R.porProd).map(([k,pp])=>{const p=prod(k)||{nombre:'?',precio:0};return `<tr><td>${esc(p.nombre)}</td><td class="n">${pp.ent}</td><td class="n">${pp.dev}</td><td class="n"><b>${pp.vend}</b></td><td class="n">${money(p.precio)}</td><td class="n">${money(pp.venta)}</td></tr>`}).join('')||'<tr><td colspan=6 class="muted">Sin datos</td></tr>'}
   </table></div></div>
   <div class="card"><h3 style="margin-top:0">Ranking de cubeteros</h3><div class="tw"><table><tr><th>#</th><th>Cubetero</th><th class="n">Vendió</th><th class="n">Venta</th><th class="n">Comisión</th><th class="n">Saldo</th></tr>
   ${porCub.map(({c,r},i)=>`<tr class="click" data-goto="${c.id}"><td>${i+1}</td><td><b>${esc(c.numero)}</b> ${esc(c.nombre)}</td><td class="n">${r.pzVend}</td><td class="n">${money(r.venta)}</td><td class="n">${money(r.com)}</td><td class="n">${money(r.saldo)}</td></tr>`).join('')||'<tr><td colspan=6 class="muted">Sin datos</td></tr>'}
   </table></div></div>`;
}
function csvEvento(ev){
  const L=[['Numero','Cubetero','Producto','Entregado','Devuelto','Vendido','Precio','Venta','Comision']];
  for(const c of S.cubeteros){const r=resumen(ev.id,c.id);for(const [k,pp] of Object.entries(r.porProd)){const p=prod(k)||{};L.push([c.numero,c.nombre,p.nombre,pp.ent,pp.dev,pp.vend,p.precio,pp.venta,pp.com])}}
  L.push([]);L.push(['Numero','Cubetero','Efectivo','Tarjeta','Saldo']);
  for(const c of S.cubeteros){const r=resumen(ev.id,c.id);if(r.movs)L.push([c.numero,c.nombre,r.ef,r.tj,r.saldo])}
  return L.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}

  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Cubeteros (${S.cubeteros.length})</h2><button class="btn sm" data-act="nuevoCub" ${dis}>＋ Cubetero</button></div>
   <div class="tw"><table><tr><th>#</th><th>Nombre</th><th class="hide-m">Teléfono</th><th class="n hide-m">Depósito</th><th>Estado</th><th></th></tr>
   ${[...S.cubeteros].sort((a,b)=>(+a.numero||0)-(+b.numero||0)).map(c=>`<tr><td><b>${esc(c.numero)}</b></td><td>${esc(c.nombre)}</td><td class="hide-m">${esc(c.telefono||'')}</td><td class="n hide-m">${c.deposito?money(c.deposito):''}</td><td>${c.activo===false?'<span class="tag gray">Baja</span>':'<span class="tag ok">Activo</span>'}</td><td><button class="btn ghost sm" data-edcub="${c.id}" ${dis}>Editar</button></td></tr>`).join('')||'<tr><td colspan=6 class="muted">Sin cubeteros.</td></tr>'}</table></div></div>`;
}
const activosTodos=()=>[...S.productos].sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre));

function formModal(title,fields,obj,onSave,onDel){
  openModal(`<h2>${title}</h2><div class="grid">${fields.map(f=>f.type==='check'?`<label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="f_${f.k}" ${obj[f.k]!==false?'checked':''}> ${f.l}</label>`
   :f.type==='select'?`<label>${f.l}<select id="f_${f.k}">${f.opts.map(([v,t])=>`<option value="${v}" ${obj[f.k]===v?'selected':''}>${t}</option>`).join('')}</select></label>`
   :`<label>${f.l}<input id="f_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any" min="0" inputmode="decimal"':''} value="${esc(obj[f.k]??'')}"></label>`).join('')}</div>
   <div class="row" style="margin-top:16px;justify-content:space-between"><span>${onDel?'<button class="btn ghost sm" data-act="borrar" style="color:var(--red)">Eliminar</button>':''}</span>
   <span class="row"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn" data-act="guardarForm">Guardar</button></span></div>`);
  FORM={fields,obj,onSave,onDel};
}
let FORM=null;
async function guardarForm(){
  const o={...FORM.obj};
  for(const f of FORM.fields){const el=$('#f_'+f.k);o[f.k]=f.type==='check'?el.checked:f.type==='number'?(+el.value||0):el.value.trim()}
  const err=FORM.onSave(o); if(err)return toast(err);
}
const PRODF=[{k:'nombre',l:'Nombre'},{k:'precio',l:'Precio de venta',type:'number'},{k:'comision',l:'Comisión del cubetero por pieza',type:'number'},{k:'orden',l:'Orden en pantalla',type:'number'},{k:'activo',l:'Activo',type:'check'}];
const CUBF=[{k:'numero',l:'No. de gafete'},{k:'nombre',l:'Nombre completo'},{k:'telefono',l:'Teléfono'},{k:'deposito',l:'Depósito en garantía',type:'number'},{k:'activo',l:'Activo',type:'check'}];
const EVF=[{k:'nombre',l:'Nombre (ej. Gigantes vs Rival)'},{k:'fecha',l:'Fecha',type:'date'},{k:'estado',l:'Estado',type:'select',opts:[['abierto','Abierto'],['cerrado','Cerrado']]}];
function editProd(p){formModal(p.id?'Editar producto':'Nuevo producto',PRODF,p,o=>{if(!o.nombre)return'Falta el nombre';if(!o.precio)return'Falta el precio';closeModal();put('productos',o)},
  p.id&&!S.movs.some(m=>m.items&&m.items[p.id])?()=>{closeModal();remove('productos',p.id)}:null)}
function editCub(c){formModal(c.id?'Editar cubetero':'Nuevo cubetero',CUBF,c,o=>{if(!o.numero||!o.nombre)return'Número y nombre son obligatorios';
  if(S.cubeteros.some(x=>x.id!==o.id&&String(x.numero)===String(o.numero)))return'Ese número de gafete ya existe';closeModal();put('cubeteros',o)},
  c.id&&!S.movs.some(m=>m.cub===c.id)?()=>{closeModal();remove('cubeteros',c.id)}:null)}
function editEv(e){formModal(e.id?'Editar evento':'Nuevo evento',EVF,e,o=>{if(!o.nombre)return'Falta el nombre';closeModal();if(!o.id)o.id=uid();pref.ev=o.id;savePref();put('eventos',o).then(render)},
  e.id&&!S.movs.some(m=>m.ev===e.id)?()=>{closeModal();remove('eventos',e.id)}:null)}

// ---------- Formatos imprimibles ----------
function qrSVG(txt){const q=qrcode(0,'M');q.addData(String(txt));q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}
function hojaHTML(title,css,body){const logo=document.querySelector('header img').src;
  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${title}</title><style>
  @page{size:letter;margin:8mm}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{background:#C8102E;color:#fff;font-weight:700;display:flex;align-items:center;gap:6px}.bar img{background:#fff;border-radius:50%}
  .tip{font-family:Arial;background:#fff8d6;border:1px solid #e6c200;padding:8px 12px;margin:8px}@media print{.tip{display:none}}${css}</style></head>
  <body><div class="tip">Usa <b>Ctrl+P</b> / Imprimir. Activa “Gráficos de fondo” para que salga el color.</div>${body.replace(/%LOGO%/g,logo)}<script>setTimeout(()=>print(),400)<\/script></body></html>`}
function gafetesHTML(){
  let cs=[...S.cubeteros].filter(c=>c.activo!==false).sort((a,b)=>(+a.numero||0)-(+b.numero||0));
  if(!cs.length)cs=Array.from({length:8},(_,i)=>({numero:String(i+1),nombre:''}));
  const css=`.grid{display:grid;grid-template-columns:repeat(2,85.6mm);gap:4mm;justify-content:center}
  .g{width:85.6mm;height:54mm;border:1px dashed #999;border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid}
  .g .bar{height:11mm;padding:0 3mm;font-size:11pt}.g .bar img{width:8mm;height:8mm}
  .g .c{flex:1;display:flex;padding:2mm 3mm;gap:2mm}.g .l{flex:1;display:flex;flex-direction:column}
  .g small{font-weight:700;font-size:7pt;letter-spacing:1px}.g .n{font-size:40pt;font-weight:800;line-height:1}
  .g .nom{margin-top:auto;font-size:9pt;border-top:1px solid #999;padding-top:1mm;min-height:5mm}.g .q{width:32mm;height:32mm;align-self:center}.g .q svg{width:100%;height:100%}`;
  return hojaHTML('Gafetes',css,`<div class="grid">${cs.map(c=>`<div class="g"><div class="bar"><img src="%LOGO%">GIGANTES AGUASCALIENTES</div>
   <div class="c"><div class="l"><small>CUBETERO</small><div class="n">${esc(c.numero)}</div><div class="nom">${esc(c.nombre||'')}</div></div><div class="q">${qrSVG(c.numero)}</div></div></div>`).join('')}</div>`)}
function comandaHTML(){
  const ps=activosTodos().filter(p=>p.activo!==false),N=24;
  const css=`.cm{height:calc((279.4mm - 16mm)/2 - 3mm);border-bottom:1px dashed #999;padding:2mm 0;display:flex;flex-direction:column;break-inside:avoid}
  .cm:last-child{border-bottom:0}.cm .bar{padding:1.5mm 3mm;font-size:11pt}.cm .bar img{width:7mm;height:7mm}.cm .bar span{margin-left:auto;font-weight:400;font-size:8pt}
  .dt{display:flex;gap:6mm;font-size:9pt;margin:2mm 0}.dt b{display:inline-block;border-bottom:1px solid #000;min-width:28mm}
  table{width:100%;border-collapse:collapse;flex:1}td,th{border:1px solid #888;font-size:7.5pt;text-align:center;padding:0}
  td.p{text-align:left;padding-left:1.5mm;white-space:nowrap;font-size:8pt;width:34mm}td.pr{width:9mm}tr:nth-child(even) td{background:#f2f2f2}
  td.k{width:5.8mm}td.k.b{font-weight:800;font-size:8.5pt}.ft{display:flex;justify-content:space-between;font-size:8pt;margin-top:1.5mm}`;
  const nums=Array.from({length:N},(_,i)=>i+1);
  const one=`<div class="cm"><div class="bar"><img src="%LOGO%">COMANDA CUBETERO<span>X = lo que se lleva · ◯ = lo que regresa</span></div>
   <div class="dt">Gafete #: <b></b> Partido / fecha: <b style="min-width:55mm"></b> Entrega no.: <b style="min-width:10mm"></b></div>
   <table><tr><th>Producto</th><th>Precio</th><th colspan="${N}">Marca la cantidad</th></tr>
   ${ps.map(p=>`<tr><td class="p">${esc(p.nombre)}</td><td class="pr">${money(p.precio)}</td>${nums.map(n=>`<td class="k${n%6?'':' b'}">${n}</td>`).join('')}</tr>`).join('')}</table>
   <div class="ft"><span>Vendido = X − ◯</span><span>Firma almacén: ____________</span><span>Firma cubetero: ____________</span></div></div>`;
  return hojaHTML('Comanda',css,one+one)}
async function bajarFormato(nombre,html){
  try{const d=window.claude&&await claude.use('downloads');if(!d)throw 0;await d.save({filename:nombre+'.html',data:html});toast('Abre el archivo descargado e imprime');return}catch(e){}
  try{const u=URL.createObjectURL(new Blob([html],{type:'text/html'}));const w=window.open(u,'_blank');
    if(!w){const a=document.createElement('a');a.href=u;a.download=nombre+'.html';document.body.appendChild(a);a.click();a.remove()}
    setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){toast('No se pudo generar el formato')}
}

// ---------- Eventos de la página ----------
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-pick],[data-goto],[data-st],[data-anular],[data-edprod],[data-edcub],[data-edev]');
  if(!t){if(e.target.id==='modal')closeModal();return}
  const d=t.dataset;
  if(d.tab){TAB=d.tab;pref.tab=TAB;savePref();render();return}
  if(d.pick||d.goto){SEL=d.pick||d.goto;QUERY='';TAB='op';render();window.scrollTo(0,0);return}
  if(d.st){const i=$('#q_'+d.st);i.value=Math.max(0,(parseInt(i.value)||0)+(+d.d));$('#mbox')._upd&&$('#mbox')._upd();return}
  if(d.anular){openModal(`<h2>Anular movimiento</h2><p>El movimiento quedará tachado y no contará en los cálculos.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn red" data-act="confAnular" data-id="${d.anular}">Anular</button></div>`);return}
  if(d.edprod){editProd(prod(d.edprod));return}
  if(d.edcub){editCub(cubOf(d.edcub));return}
  if(d.edev){editEv(S.eventos.find(x=>x.id===d.edev));return}
  const A={
    cerrarSel(){SEL=null;render();setTimeout(()=>$('#buscar')&&$('#buscar').focus(),0)},
    entrega:modalEntrega,pago:modalPago,corte:modalCorte,cerrarModal:closeModal,impGafetes(){bajarFormato('Gafetes_Cubeteros_QR',gafetesHTML())},impComanda(){bajarFormato('Comanda_Cubetero',comandaHTML())},
    guardarEntrega,guardarPago,guardarCorte,guardarForm,
    borrar(){FORM.onDel&&FORM.onDel()},
    async confAnular(){const m=S.movs.find(x=>x.id===d.id);closeModal();if(m)await put('movs',{...m,anulado:true,anuladoPor:pref.punto||'',anuladoTs:Date.now()});toast('Movimiento anulado')},
    nuevoProd(){editProd({activo:true,comision:0,orden:S.productos.length+1})},
    nuevoCub(){const n=Math.max(0,...S.cubeteros.map(c=>+c.numero||0))+1;editCub({numero:String(n),activo:true})},
    nuevoEv(){editEv({fecha:new Date().toISOString().slice(0,10),estado:'abierto'})},
    async cerrarEv(){const ev=evActual();openModal(`<h2>Cerrar evento</h2><p>Ya no se podrán registrar entregas ni pagos en <b>${esc(ev.nombre)}</b>. Puedes reabrirlo desde Configuración.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn red" data-act="confCerrarEv">Cerrar evento</button></div>`)},
    async confCerrarEv(){const ev=evActual();closeModal();await put('eventos',{...ev,estado:'cerrado'});toast('Evento cerrado')},
    async csv(){try{await navigator.clipboard.writeText(csvEvento(evActual()));toast('CSV copiado: pégalo en Excel o Sheets')}catch(err){openModal(`<h2>CSV del evento</h2><textarea style="width:100%;height:240px">${esc(csvEvento(evActual()))}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="cerrarModal">Cerrar</button></div>`)}}
  };
  if(A[d.act])A[d.act]();
});
document.addEventListener('input',e=>{
  if(e.target.id==='buscar'){QUERY=e.target.value;SEL=null;render()}
  if(e.target.id==='punto'){pref.punto=e.target.value;savePref()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.target.id==='buscar'&&e.key==='Enter'){
    const q=QUERY.trim().toLowerCase();
    const c=S.cubeteros.find(c=>String(c.numero).toLowerCase()===q)||S.cubeteros.filter(c=>c.activo!==false&&((c.nombre||'').toLowerCase().includes(q)||String(c.numero).startsWith(q)))[0];
    if(c){SEL=c.id;QUERY='';render()}else toast('No se encontró el cubetero');
  }
});
$('#evSel').addEventListener('change',e=>{pref.ev=e.target.value;savePref();SEL=null;render()});
render(); init();
</script>
</body>
</html>
