<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gigantes · Requisiciones de Compra</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d3963;--navy2:#082848;--sky:#6cb3df;--sky2:#e3f1fa;--red:#c8102e;--ink:#10223a;--mut:#5b6b80;--line:#d7e2ec;--bg:#f3f7fb;--ok:#1b8a4b;--warn:#c27c00}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;letter-spacing:.3px}
header{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--red)}
header img{width:46px}
header h1{margin:0;font-size:24px;line-height:1}
header small{display:block;color:var(--sky);font-family:Barlow;font-size:13px}
.hspace{flex:1}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:#fff2;white-space:nowrap}.pill.off{background:var(--warn)}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:13px 14px;font:600 15px Barlow;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--red)}
nav .badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0;width:100%}
textarea{min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:var(--sky)}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.btn{font:700 15px Barlow;border:0;border-radius:9px;padding:10px 15px;cursor:pointer;background:var(--navy);color:#fff;white-space:nowrap}
.btn.red{background:var(--red)}.btn.ok{background:var(--ok)}.btn.sky{background:var(--sky);color:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpi{background:var(--sky2);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi b{display:block;font:700 26px "Barlow Condensed";color:var(--navy)}
.kpi span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi.alert{background:#fde8eb}.kpi.alert b{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--sky2)}
.tw{overflow-x:auto}
.muted{color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap;display:inline-block}
.e-borrador{background:#eee;color:#666}.e-enviada{background:#fff1d6;color:#8a5a00}.e-aprobada{background:var(--sky2);color:var(--navy)}
.e-rechazada,.e-cancelada{background:#fde8eb;color:var(--red)}.e-comprada{background:#e7e3fb;color:#4b3aa6}.e-parcial{background:#fff1d6;color:#8a5a00}.e-recibida,.e-cerrada{background:#e3f5ea;color:var(--ok)}
.urg{background:var(--red);color:#fff}
.fol{font:800 18px "Barlow Condensed";color:var(--navy)}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;padding:3vh 10px;z-index:20;overflow:auto}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:14px;max-width:860px;width:100%;padding:18px}
#modal h2{margin:0 0 10px;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30}
.banner{background:#fff4dc;border:1px solid #f1d38f;color:#7a5200;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.items td input{padding:7px 8px}
.flow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}
.flow span{font-size:12px;padding:4px 10px;border-radius:6px;background:#eef3f8;color:#8a99ab}
.flow span.done{background:var(--navy);color:#fff}.flow span.cur{background:var(--red);color:#fff}
.hist{border-left:3px solid var(--line);padding-left:12px;margin-left:4px}
.hist div{margin-bottom:8px;font-size:14px}
.totalbar{background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.totalbar b{font:800 24px "Barlow Condensed"}
@media(max-width:640px){.hide-m{display:none}header h1{font-size:20px}}
</style>
</head>

  <div><h1>REQUISICIONES DE COMPRA</h1><small>Gigantes Aguascalientes · Administración</small></div>
  <div class="hspace"></div><span id="who" class="pill"></span><span id="modePill" class="pill">Cargando…</span>

<main id="main"><div class="empty">Cargando…</div></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
const COLS=['reqs','proveedores','config'];
const S={reqs:[],proveedores:[],config:[]};
let DB=null,USER=null,ME={id:null,name:''},CANAPPROVE=false,MODE='cargando',STALE=false,READONLY=false;
const LSKEY='gig_req_v1',PREF='gig_req_pref';
const pref=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||'{}')}catch(e){return{}}})();
const savePref=()=>{try{localStorage.setItem(PREF,JSON.stringify(pref))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round((n||0)*100)/100).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=t=>t?new Date(t).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'';
const fdt=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800)}
const clean=o=>JSON.parse(JSON.stringify(o));

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LSKEY)||'{}');COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
async function put(col,obj){
  obj={...obj};if(!obj.id)obj.id=uid();
  if(DB){const {id,...rest}=obj;
    try{await DB.collection(col).doc(id).set(clean(rest))}
    catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,900));await DB.collection(col).doc(id).set(clean(rest))}
      else{if(e&&e.code==='invalid_argument'){READONLY=true;render()}toast('No se pudo guardar'+(e&&e.code==='invalid_argument'?': sin permiso':''));throw e}}
  }else{const a=S[col],i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);saveLocal();render()}
  return obj;
}
async function remove(col,id){if(DB){await DB.collection(col).doc(id).delete()}else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}}

// Folio consecutivo con candado para evitar duplicados entre dispositivos
async function nextFolio(){
  if(!DB){const n=Math.max(0,...S.reqs.map(r=>r.num||0))+1;return n}
  const ref=DB.doc('meta/folio'),holder=ME.id||uid();
  for(let i=0;i<8;i++){
    const l=await ref.acquire({holder,ttlMs:5000});
    if(l.acquired){const s=await ref.get();const base=Math.max((s.exists&&s.data().n)||0,...S.reqs.map(r=>r.num||0));const n=base+1;await ref.set({n});return n}
    await new Promise(r=>setTimeout(r,400+Math.random()*500));
  }
  return Math.max(0,...S.reqs.map(r=>r.num||0))+1;
}
const folioTxt=n=>'REQ-'+String(n).padStart(4,'0');

async function init(){
  let db=null;
  try{if(window.claude&&claude.use){[db,USER]=await Promise.all([claude.use('db'),claude.use('user')])}}catch(e){}
  if(USER){try{const m=await USER.me();ME={id:m.id,name:m.name};CANAPPROVE=!!m.canEdit||!!m.isOwner}catch(e){}}
  if(db){DB=db;MODE='nube';const pend=new Set(COLS);const tm=setTimeout(()=>{STALE=true;render()},10000);
    COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){pend.delete(c);if(!pend.size){clearTimeout(tm);STALE=false}}render()},
      e=>{clearTimeout(tm);STALE=true;render()}));
  }else{MODE='local';CANAPPROVE=true;loadLocal()}
  if(!pref.nombre&&ME.name){pref.nombre=ME.name;savePref()}
  render();
}

// ---------- Config ----------
const DEF_AREAS=['Bebidas / Almacén','Administración','Mantenimiento','Taquilla','Equipo deportivo','Mercadotecnia','Limpieza'];
const cfg=()=>S.config.find(c=>c.id==='general')||{id:'general',areas:DEF_AREAS,limite:0,unidades:['pza','caja','paquete','kg','lt','servicio']};
const ESTADOS=['borrador','enviada','aprobada'];
const ELBL={borrador:'Borrador',enviada:'Por autorizar',aprobada:'Autorizada',rechazada:'Rechazada',comprada:'Comprada',parcial:'Recibida parcial',recibida:'Recibida',cerrada:'Cerrada',cancelada:'Cancelada'};
const tagE=e=>`<span class="tag e-${e}">${ELBL[e]||e}</span>`;
const totEst=r=>(r.items||[]).reduce((s,i)=>s+(+i.cant||0)*(+i.precio||0),0);
const totReal=r=>r.compra?(r.items||[]).reduce((s,i)=>s+(+i.cant||0)*(+(i.precioReal??i.precio)||0),0)+(+r.compra.extra||0):0;

// ---------- Vistas ----------
let TAB=pref.tab||'lista',FILTRO=pref.filtro||'activas',Q='';
function render(){
  $('#modePill').textContent=MODE==='nube'?(STALE?'Sin conexión':'En línea'):MODE==='local'?'Solo este dispositivo':'Cargando…';
  $('#modePill').className='pill'+(MODE==='local'||STALE?' off':'');
  $('#who').textContent=(pref.nombre||ME.name||'')+(CANAPPROVE?' · Administración':'');
  $('#who').style.display=(pref.nombre||ME.name)?'':'none';
  const pend=S.reqs.filter(r=>r.estado==='enviada').length;
  const tabs=[['lista','Requisiciones'],['nueva','＋ Nueva']].concat(CANAPPROVE?[['aprobar','Por autorizar'+(pend?`<span class="badge">${pend}</span>`:'')]]:[]).concat([['cfg','Configuración']]);
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${TAB===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
  let h='';
  if(MODE==='local')h+='<div class="banner">Modo local: los datos se guardan solo en este navegador.</div>';
  if(READONLY)h+='<div class="banner">Acceso de solo lectura. Pide permiso de <b>Colaborador</b> para capturar requisiciones.</div>';
  if(TAB==='lista')h+=viewLista();
  else if(TAB==='nueva'){openForm({});TAB='lista';h+=viewLista()}
  else if(TAB==='aprobar')h+=viewAprobar();
  else if(TAB==='prov')h+=viewProv();
  else if(TAB==='cfg')h+=viewCfg();
  const f=document.activeElement&&document.activeElement.id;
  $('#main').innerHTML=h;
  if(f==='q'){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  if(OPEN&&$('#modal').classList.contains('on')&&$('#mbox').dataset.view==='det'&&!($('#actForm')&&$('#actForm').innerHTML))verDetalle(OPEN,true);
}
const fAut=r=>{const h=[...(r.hist||[])].reverse().find(h=>/Aprob|Autoriz/.test(h.accion));return h?new Date(h.ts).toISOString().slice(0,7):''};
function kpis(){
  const m=new Date().toISOString().slice(0,7);
  const R=S.reqs;
  const k=[['enviada','Por autorizar',R.filter(r=>r.estado==='enviada').length],
    ['urgentes','Urgentes por autorizar',R.filter(r=>r.urgente&&r.estado==='enviada').length],
    ['aprobada','Autorizadas',R.filter(r=>r.estado==='aprobada').length],
    ['mes','Autorizado este mes',money(R.filter(r=>r.estado==='aprobada'&&fAut(r).startsWith(m)).reduce((s,r)=>s+totEst(r),0))]];
  return `<div class="grid" style="margin-bottom:14px">${k.map(([f,l,v])=>`<div class="kpi ${f==='urgentes'&&v?'alert':''}" data-filtro="${f}"><span>${l}</span><b>${v}</b></div>`).join('')}</div>`;
}
function filtrar(){
  const q=Q.trim().toLowerCase();
  let R=[...S.reqs];
  const F={activas:r=>['borrador','enviada'].includes(r.estado),todas:()=>true,
    urgentes:r=>r.urgente&&r.estado==='enviada',mes:r=>r.estado==='aprobada'&&fAut(r).startsWith(new Date().toISOString().slice(0,7))};
  R=R.filter(F[FILTRO]||(r=>r.estado===FILTRO));
  if(q)R=R.filter(r=>[folioTxt(r.num),r.solicitante,r.area,r.motivo,...(r.items||[]).map(i=>i.desc),(r.compra||{}).proveedor].join(' ').toLowerCase().includes(q));
  return R.sort((a,b)=>(b.num||0)-(a.num||0));
}
function tabla(R){
  if(!R.length)return '<div class="empty">No hay requisiciones con este filtro.</div>';

  <td>${esc(r.solicitante)}<div class="muted">${esc(r.area)}</div></td><td class="hide-m">${esc((r.items||[]).map(i=>i.desc).slice(0,3).join(', '))}${(r.items||[]).length>3?'…':''}<div class="muted">${esc(r.motivo||'')}</div></td>
  <td class="n">${money(r.compra?totReal(r):totEst(r))}${r.compra?'':'<div class="muted">estimado</div>'}</td><td>${tagE(r.estado)}</td></tr>`).join('')}</table></div>`;
}

function updTot(){$('#rTot').textContent=money(ITEMS.reduce((s,i)=>s+(+i.cant||0)*(+i.precio||0),0))}
async function guardarReq(enviar){
  const items=ITEMS.filter(i=>i.desc.trim()&&+i.cant>0).map(i=>({...i,desc:i.desc.trim()}));
  const sol=$('#rSol').value.trim();
  if(!sol)return toast('Falta el solicitante');
  if(!items.length)return toast('Agrega al menos un artículo con cantidad');
  if(enviar&&!$('#rMot').value.trim())return toast('Escribe el motivo');
  pref.nombre=pref.nombre||sol;savePref();
  const r={...FORMREQ,solicitante:sol,area:$('#rArea').value,fechaReq:$('#rFecha').value,urgente:$('#rUrg').checked,motivo:$('#rMot').value.trim(),obs:$('#rObs').value.trim(),items};
  const btns=$('#mbox').querySelectorAll('button');btns.forEach(b=>b.disabled=true);
  try{
    if(!r.id){r.num=await nextFolio();r.creada=Date.now();r.creadaPor=ME.id;r.hist=[]}
    r.hist=[...(r.hist||[]),{ts:Date.now(),quien:pref.nombre||sol,accion:FORMREQ.id?'Editó':'Creó'}];
    r.estado='borrador';
    if(enviar){r.estado='enviada';r.hist.push({ts:Date.now(),quien:pref.nombre||sol,accion:'Envió a autorización'});
      const lim=+cfg().limite||0;if(lim&&totEst(r)<=lim){r.estado='aprobada';r.hist.push({ts:Date.now(),quien:'Sistema',accion:'Autorización automática',nota:'Monto menor a '+money(lim)})}}
    const saved=await put('reqs',r);closeModal();toast(folioTxt(r.num)+(enviar?' enviada':' guardada'));(function w(n){S.reqs.find(x=>x.id===saved.id)||n<=0?verDetalle(saved.id):setTimeout(()=>w(n-1),150)})(10);
  }catch(e){btns.forEach(b=>b.disabled=false)}
}

// Detalle y flujo
function verDetalle(id,keep){
  const r=S.reqs.find(x=>x.id===id);if(!r){closeModal();return}
  OPEN=id;
  const idx=ESTADOS.indexOf(r.estado);
  const flow=['borrador','enviada','aprobada'].map((e,i)=>`<span class="${['rechazada','cancelada'].includes(r.estado)?'':i<idx?'done':i===idx?'cur':''}">${['Solicita','Enviada','Autorizada'][i]}</span>`).join('');
  const C=r.compra;
  const acts=[];
  if(!READONLY){
    if(r.estado==='borrador')acts.push(['editar','Editar','ghost'],['enviar','Enviar a autorización','red']);
    if(r.estado==='enviada'&&CANAPPROVE)acts.push(['rechazar','Rechazar','ghost'],['aprobar','Autorizar','ok']);
    if(r.estado==='rechazada')acts.push(['editar','Corregir y reenviar','ghost']);
    if(['borrador','enviada','rechazada'].includes(r.estado))acts.unshift(['cancelar','Cancelar requisición','ghost']);
  }
  const anyRec=(r.items||[]).some(i=>i.recibido);
  openModal(`<div class="row between"><div><span class="fol" style="font-size:28px">${folioTxt(r.num)}</span> ${tagE(r.estado)} ${r.urgente?'<span class="tag urg">URGENTE</span>':''}</div><button class="btn ghost sm" data-act="cerrarModal">✕</button></div>
  <div class="flow">${flow}</div>
  <div class="grid"><div><div class="muted">Solicitante</div><b>${esc(r.solicitante)}</b></div><div><div class="muted">Área</div><b>${esc(r.area)}</b></div>
  <div><div class="muted">Creada</div><b>${fd(r.creada)}</b></div><div><div class="muted">Requerida para</div><b>${r.fechaReq?fd(r.fechaReq+'T12:00'):'—'}</b></div></div>
  <p><span class="muted">Motivo:</span> ${esc(r.motivo||'—')}</p>
  <div class="tw"><table><tr><th>Artículo</th><th class="n">Cant.</th><th>Unidad</th><th class="n">Precio est.</th>${C?'<th class="n">Precio real</th>':''}${anyRec||C?'<th class="n">Recibido</th>':''}<th class="n">Importe</th></tr>
  ${(r.items||[]).map(i=>`<tr><td>${esc(i.desc)}${i.prov?`<div class="muted">${esc(i.prov)}</div>`:''}</td><td class="n">${i.cant}</td><td>${esc(i.unidad)}</td><td class="n">${money(i.precio)}</td>
   ${C?`<td class="n">${money(i.precioReal??i.precio)}</td>`:''}${anyRec||C?`<td class="n" style="color:${(i.recibido||0)>=i.cant?'var(--ok)':'var(--warn)'}">${i.recibido||0}</td>`:''}<td class="n">${money(i.cant*(C?(i.precioReal??i.precio):i.precio))}</td></tr>`).join('')}</table></div>
  <div class="totalbar"><span>${C?'Total real':'Total estimado'}${C&&C.extra?` (incluye ${money(C.extra)} de envío/otros)`:''}</span><b>${money(C?totReal(r):totEst(r))}</b></div>
  ${C?`<div class="card" style="margin-top:12px;background:#faf9ff"><b>Compra</b><div class="grid" style="margin-top:6px"><div><div class="muted">Proveedor</div>${esc(C.proveedor)}</div><div><div class="muted">Fecha</div>${fd(C.fecha+'T12:00')}</div><div><div class="muted">Factura / OC</div>${esc(C.factura||'—')}</div><div><div class="muted">Forma de pago</div>${esc(C.pago||'—')}</div></div></div>`:''}
  ${r.obs?`<p><span class="muted">Observaciones:</span> ${esc(r.obs)}</p>`:''}
  <h3>Historial</h3><div class="hist">${(r.hist||[]).slice().reverse().map(h=>`<div><b>${esc(h.accion)}</b> · ${esc(h.quien||'')} <span class="muted">${fdt(h.ts)}</span>${h.nota?`<div class="muted">“${esc(h.nota)}”</div>`:''}</div>`).join('')}</div>
  <div id="actForm"></div>
  <div class="row between" style="margin-top:14px"><button class="btn ghost sm" data-act="descargar">Descargar formato</button><span class="row">${acts.map(([a,l,c])=>`<button class="btn ${c}" data-flow="${a}">${l}</button>`).join('')}</span></div>`,'det');
}
function quien(){return pref.nombre||ME.name||'—'}
async function mover(r,estado,accion,nota,extra){
  const nr={...r,...(extra||{}),estado,hist:[...(r.hist||[]),{ts:Date.now(),quien:quien(),accion,...(nota?{nota}:{})}]};
  if(estado==='aprobada'&&ME.id)nr.aprobadaPor=ME.id;
  await put('reqs',nr);if($('#actForm'))$('#actForm').innerHTML='';OPEN&&verDetalle(OPEN);if(DB)setTimeout(()=>OPEN&&verDetalle(OPEN),300);toast(folioTxt(r.num)+': '+accion);
}
function flowAct(a){
  const r=S.reqs.find(x=>x.id===OPEN);if(!r)return;
  const box=$('#actForm');
  const confirmBox=(titulo,campo,btn,cls,fn)=>{box.innerHTML=`<div class="card" style="margin-top:12px;border-color:var(--sky)"><b>${titulo}</b>${campo?`<label style="margin-top:6px">Comentario<textarea id="aNota"></textarea></label>`:''}<div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost sm" data-flow="x">Volver</button><button class="btn ${cls}" id="aGo">${btn}</button></div></div>`;
    $('#aGo').onclick=async()=>{const n=$('#aNota')?$('#aNota').value.trim():'';const e=fn(n);if(typeof e==='string')return toast(e);$('#aGo').disabled=true;await e};box.scrollIntoView({behavior:'smooth'})};
  if(a==='x'){box.innerHTML='';return}
  if(a==='editar'){openForm(r);return}
  if(a==='enviar')return confirmBox('¿Enviar a autorización?',false,'Enviar','red',()=>mover(r,(+cfg().limite&&totEst(r)<=+cfg().limite)?'aprobada':'enviada','Envió a autorización'));
  if(a==='aprobar')return confirmBox('Autorizar requisición',true,'Autorizar','ok',n=>mover(r,'aprobada','Autorizó',n));
  if(a==='rechazar')return confirmBox('Rechazar requisición',true,'Rechazar','red',n=>n?mover(r,'rechazada','Rechazó',n):'Escribe el motivo del rechazo');
  if(a==='cancelar')return confirmBox('Cancelar requisición',true,'Cancelar requisición','red',n=>mover(r,'cancelada','Canceló',n));
  if(a==='cerrar')return confirmBox('Cerrar requisición',true,'Cerrar','',n=>mover(r,'cerrada','Cerró',n));
  if(a==='comprar'){
    const sugerido=(r.items||[]).map(i=>i.prov).find(Boolean)||'';
    box.innerHTML=`<div class="card" style="margin-top:12px;border-color:var(--sky)"><b>Registrar compra</b>
     <div class="grid" style="margin-top:8px"><label>Proveedor<input id="cProv" list="dlProv2" value="${esc(sugerido)}"><datalist id="dlProv2">${S.proveedores.map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist></label>
     <label>Fecha de compra<input id="cFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Factura / Orden de compra<input id="cFac"></label>
     <label>Forma de pago<select id="cPago"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Crédito proveedor</option></select></label></div>
     <table style="margin-top:8px"><tr><th>Artículo</th><th class="n">Cant.</th><th class="n" style="width:140px">Precio real unitario</th></tr>${(r.items||[]).map((i,k)=>`<tr><td>${esc(i.desc)}</td><td class="n">${i.cant} ${esc(i.unidad)}</td><td><input id="cP${k}" type="number" step="any" min="0" value="${i.precio||0}"></td></tr>`).join('')}</table>
     <label style="margin-top:8px">Envío / otros cargos<input id="cExtra" type="number" step="any" min="0" value="0"></label>
     <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost sm" data-flow="x">Volver</button><button class="btn sky" id="aGo">Guardar compra</button></div></div>`;
    $('#aGo').onclick=async()=>{const prov=$('#cProv').value.trim();if(!prov)return toast('Indica el proveedor');
      let p=S.proveedores.find(x=>x.nombre.toLowerCase()===prov.toLowerCase());
      $('#aGo').disabled=true;
      if(!p)p=await put('proveedores',{nombre:prov});
      const items=r.items.map((i,k)=>({...i,precioReal:+$('#cP'+k).value||0}));
      await mover(r,'comprada','Registró compra',null,{items,compra:{proveedor:p.nombre,proveedorId:p.id,fecha:$('#cFecha').value,factura:$('#cFac').value.trim(),pago:$('#cPago').value,extra:+$('#cExtra').value||0}})};
    box.scrollIntoView({behavior:'smooth'});return;
  }
  if(a==='recibir'){
    box.innerHTML=`<div class="card" style="margin-top:12px;border-color:var(--ok)"><b>Registrar recepción</b><p class="muted">Captura lo que llegó en esta entrega.</p>
     <table><tr><th>Artículo</th><th class="n">Pedido</th><th class="n">Ya recibido</th><th class="n" style="width:120px">Llega ahora</th></tr>${(r.items||[]).map((i,k)=>`<tr><td>${esc(i.desc)}</td><td class="n">${i.cant}</td><td class="n">${i.recibido||0}</td><td><input id="rc${k}" type="number" step="any" min="0" value="${Math.max(0,i.cant-(i.recibido||0))}"></td></tr>`).join('')}</table>
     <label style="margin-top:8px">Comentario (faltantes, daños…)<input id="aNota"></label>
     <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost sm" data-flow="x">Volver</button><button class="btn ok" id="aGo">Guardar recepción</button></div></div>`;
    $('#aGo').onclick=async()=>{const items=r.items.map((i,k)=>({...i,recibido:(i.recibido||0)+(+$('#rc'+k).value||0)}));
      const completo=items.every(i=>i.recibido>=i.cant);$('#aGo').disabled=true;
      await mover(r,completo?'recibida':'parcial',completo?'Recibió completo':'Recibió parcial',$('#aNota').value.trim(),{items})};
    box.scrollIntoView({behavior:'smooth'});
  }
}

table{width:100%;border-collapse:collapse}td,th{border:1px solid #000;padding:3px 5px}
.hd td{vertical-align:middle}.hd .lg{width:92px;text-align:center;padding:4px}.hd .lg img{width:78px}
.hd .tt{text-align:center;font-size:17px;font-weight:bold;color:#0d3963}.hd .ctl{width:150px;font-size:9px;line-height:1.5}
.hd .ctl b{display:inline-block;width:72px;font-weight:normal}
.lb{font-weight:bold;background:#e9eef4;white-space:nowrap}.c{text-align:center}.n{text-align:right}
.it{margin-top:-1px}.it th{background:#0d3963;color:#fff;font-size:10px;line-height:1.25}.it th small{font-weight:normal;display:block}
.it td{height:27px;font-size:10.5px;text-align:center}.it td.d{text-align:left}.it td.n{text-align:right}
.tot td{font-weight:bold;background:#e9eef4}
.jt{margin-top:10px}.jt th{background:#e9eef4;font-size:11px}.jt td{height:46px;text-align:center;font-size:12px}
.fr{width:84%;margin:22px auto 0}.fr td{height:52px;text-align:center;vertical-align:bottom;font-size:11px;width:50%}.fr tr:last-child td{height:auto;font-weight:bold;padding:4px}
.x{display:inline-block;width:24px;text-align:center;font-weight:bold}
.bar{height:5px;background:#c8102e;margin-top:10px}
</style></head><body>
<table class="hd"><tr><td class="lg" rowspan="3"><img src="${logo}"></td><td class="tt" colspan="6">Requisición de compra</td>
<td class="ctl" rowspan="3"><b>No. de Documento</b>GA-REQ-F1<br><b>Revisión</b>00<br><b>Folio</b><span style="color:#c8102e;font-weight:bold">${blank?'':folioTxt(r.num)}</span><br><b>Fecha emisión</b>18/11/2026</td></tr>
<tr><td class="lb">FECHA</td><td>${blank?'':fd(r.creada)}</td><td class="lb">ÁREA / DEPTO.</td><td colspan="3">${v(r.area)}</td></tr>
<tr><td class="lb">SOLICITANTE</td><td>${v(r.solicitante)}</td><td class="lb">REQUERIDA PARA</td><td>${blank?'':(r.fechaReq?fd(r.fechaReq+'T12:00'):'—')}</td>
<td class="lb">TIPO DE SOLICITUD</td><td style="white-space:nowrap">Normal <span class="x">${!blank&&!r.urgente?'X':''}</span> Urgente <span class="x">${!blank&&r.urgente?'X':''}</span></td></tr></table>
<table class="it"><tr><th style="width:26px">#</th><th style="width:62px">CANTIDAD</th><th style="width:78px">UNIDAD<small>(pieza, caja, paquete, litros, etc.)</small></th>
<th>DESCRIPCIÓN<small>(nombre, marca, modelo, presentación, medidas)</small></th><th style="width:140px">PROVEEDOR SUGERIDO<small>(nombre, contacto, teléfono)</small></th><th style="width:78px">PRECIO UNIT. EST.</th><th style="width:84px">IMPORTE</th></tr>
${items.map((i,k)=>i?`<tr><td>${k+1}</td><td>${i.cant}</td><td>${esc(i.unidad)}</td><td class="d">${esc(i.desc)}</td><td>${esc(i.prov||'')}</td><td class="n">${money(i.precio)}</td><td class="n">${money(i.precio*i.cant)}</td></tr>`:`<tr><td>${k+1}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}
<tr class="tot"><td colspan="6" class="n">TOTAL ESTIMADO</td><td class="n">${blank?'':money(totEst(r))}</td></tr></table>
<table class="jt"><tr><th>JUSTIFICACIÓN (necesidad de la compra del material).</th></tr><tr><td>${v(r.motivo)}${!blank&&r.obs?`<div style="font-size:10.5px;margin-top:4px">Obs.: ${esc(r.obs)}</div>`:''}</td></tr></table>
<table class="fr"><tr><td>${v(r.solicitante)}</td><td>${blank?'':esc(aut?aut.quien+' · '+fd(aut.ts):'')}</td></tr>
<tr><td>Solicitó (Nombre y firma)</td><td>Autorizó · Administración (Nombre y firma)</td></tr></table>
<div class="bar"></div>
</body></html>`;
}
async function descargar(blank){
  const r=blank?{}:S.reqs.find(x=>x.id===OPEN);if(!r)return;
  try{const d=window.claude&&await claude.use('downloads');if(!d)throw 0;await d.save({filename:(blank?'Formato_requisicion':folioTxt(r.num))+'.html',data:formatoHTML(r)});toast('Abre el archivo y usa Imprimir → Guardar como PDF')}
  catch(e){try{const html=formatoHTML(r),u=URL.createObjectURL(new Blob([html],{type:'text/html'})),w=window.open(u,'_blank');
    if(!w){const a=document.createElement('a');a.href=u;a.download=(blank?'Formato_requisicion':folioTxt(r.num))+'.html';document.body.appendChild(a);a.click();a.remove()}
    setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Se abrió el formato: usa Imprimir → Guardar como PDF')}catch(e2){toast('No se pudo descargar en este navegador')}}
}
function csv(){
  const L=[['Folio','Fecha','Solicitante','Area','Estado','Autorizo','Urgente','Articulo','Cantidad','Unidad','Precio est','Importe','Proveedor sugerido']];
  for(const r of filtrar())for(const i of r.items||[])L.push([folioTxt(r.num),fd(r.creada),r.solicitante,r.area,ELBL[r.estado],([...(r.hist||[])].reverse().find(h=>/Aprob|Autoriz/.test(h.accion))||{}).quien||'',r.urgente?'Si':'No',i.desc,i.cant,i.unidad,i.precio,i.cant*i.precio,i.prov||'']);
  return L.map(x=>x.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}
function editProv(p){
  const F=[['nombre','Nombre / razón social'],['giro','Giro (bebidas, hielo, limpieza…)'],['contacto','Contacto'],['tel','Teléfono'],['email','Correo'],['rfc','RFC']];
  openModal(`<h2>${p.id?'Editar':'Nuevo'} proveedor</h2><div class="grid">${F.map(([k,l])=>`<label>${l}<input id="p_${k}" value="${esc(p[k]||'')}"></label>`).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-act="cerrarModal">Cancelar</button><button class="btn" id="pGo">Guardar</button></div>`,'prov');
  $('#pGo').onclick=async()=>{const o={...p};F.forEach(([k])=>o[k]=$('#p_'+k).value.trim());if(!o.nombre)return toast('Falta el nombre');closeModal();await put('proveedores',o)};
}

// ---------- Eventos ----------
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-open],[data-filtro],[data-flow],[data-delitem],[data-edprov]');
  if(!t){if(e.target.id==='modal')closeModal();return}
  const d=t.dataset;
  if(d.tab){TAB=d.tab;if(TAB!=='nueva'){pref.tab=TAB;savePref()}render();return}
  if(d.open){verDetalle(d.open);return}
  if(d.filtro){FILTRO=d.filtro==='enviada'||d.filtro==='aprobada'?d.filtro:d.filtro;TAB='lista';render();return}
  if(d.flow){flowAct(d.flow);return}
  if(d.delitem!=null){ITEMS.splice(+d.delitem,1);if(!ITEMS.length)ITEMS.push({desc:'',cant:1,unidad:'pza',precio:0,prov:''});drawItems();return}
  if(d.edprov){editProv(S.proveedores.find(p=>p.id===d.edprov));return}
  const A={cerrarModal:closeModal,addItem(){ITEMS.push({desc:'',cant:1,unidad:(cfg().unidades||['pza'])[0],precio:0,prov:''});drawItems();const ins=$('#itemsBox').querySelectorAll('input[data-f=desc]');ins[ins.length-1].focus()},
    guardarReq(){guardarReq(d.enviar==='1')},nuevoProv(){editProv({})},descargar(){descargar()},formatoBlanco(){descargar(true)},
    async xls(){const n='Requisiciones_'+new Date().toISOString().slice(0,10)+'.csv',data='\ufeff'+csv();
      try{const d=window.claude&&await claude.use('downloads');if(!d)throw 0;await d.save({filename:n,data});toast('Archivo descargado: '+n);return}catch(e){}
      const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Archivo descargado: '+n)},
    async csv(){try{await navigator.clipboard.writeText(csv());toast('CSV copiado: pégalo en Excel')}catch(err){openModal(`<h2>CSV</h2><textarea style="height:260px">${esc(csv())}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-act="cerrarModal">Cerrar</button></div>`)}},
    async guardarCfg(){const c={...cfg(),areas:$('#cAreas').value.split('\n').map(s=>s.trim()).filter(Boolean),unidades:$('#cUni').value.split(',').map(s=>s.trim()).filter(Boolean),limite:+$('#cLim').value||0};await put('config',c);toast('Configuración guardada')}};
  if(A[d.act])A[d.act]();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){Q=e.target.value;render()}
  if(e.target.id==='miNombre'){pref.nombre=e.target.value.trim();savePref();$('#who').textContent=pref.nombre}
});
document.addEventListener('change',e=>{if(e.target.id==='filtro'){FILTRO=e.target.value;pref.filtro=FILTRO;savePref();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();init();
</script>
</body>
</html>
